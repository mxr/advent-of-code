[project]
name = "advent_of_code"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["version"]

[dependency-groups]
dev = [
  "dijkstar",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]  # generated by mxr/base
plugins = ["covdefaults"]

[tool.mypy]  # generated by mxr/base
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "testing.*"

[[tool.mypy.overrides]]  # generated by mxr/base
disallow_untyped_defs = false
module = "tests.*"

[tool.ruff]  # generated by mxr/base
target-version = "py314"

[tool.ruff.lint]  # generated by mxr/base
extend-select = [
  "A",  # see flake8-builtins
  "B",  # see flake8-bugbear
  "C4",  # see flake8-comprehension
  "I",  # sort imports
  "SIM",  # see flake8-simplify
  "TC",  # see flake8-type-checking
  "UP",  # see pyupgrade
]

[tool.ruff.lint.isort]  # generated by mxr/base
force-single-line = true

[tool.setuptools.packages.find]
where = ["."]

[tool.tombi]  # generated by mxr/base
offline = true
string-quote-style = "double"

[tool.tox]  # generated by mxr/base
env_list = ["py", "pre-commit"]

[tool.tox.env.pre-commit]  # generated by mxr/base
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure"]]
deps = ["pre-commit-uv"]
skip_install = true

[tool.tox.env_run_base]  # generated by mxr/base
commands = [
  ["coverage", "erase"],
  ["coverage", "run", "-m", "pytest", "{posargs:tests}"],
  ["coverage", "report"],
]
dependency_groups = ["dev"]

[tool.ty.rules]  # generated by mxr/base
all = "error"
