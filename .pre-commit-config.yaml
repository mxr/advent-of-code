repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
  - id: trailing-whitespace
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-comma]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/asottile/reorder-python-imports
  rev: 5e38415c12154247a099c7023c210e3d458275b5  # frozen: v3.17.0
  hooks:
  - id: reorder-python-imports
    args: [--py313-plus, --add-import, from __future__ import annotations]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 2700fd5671c633760d912769c041bfcde2b9a01b  # frozen: v0.15.22
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 41e691678310dfd3833f7ab4e180ddb014310356  # frozen: v2.3.0
  hooks:
  - id: mypy
    language_version: python3.14
    additional_dependencies:
    - dijkstar
    - setuptools
- repo: https://github.com/mxr/mirrors-ty
  rev: febed8a7b2665e80a9d3855c59ac716a6284d628  # frozen: v0.0.61
  hooks:
  - id: ty
    additional_dependencies:
    - dijkstar
    - setuptools
- repo: https://github.com/mxr/sync-typing-deps
  rev: v0.5.3
  hooks:
  - id: sync-typing-deps
