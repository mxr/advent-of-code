repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 321478e58f4938179c6b86e4ddfa923d1547a49b  # frozen: v0.16.6
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/hukkin/mdformat
  rev: 2d496dbc18e31b83a1596685347ffe0b6041daf0  # frozen: 1.0.0
  hooks:
  - id: mdformat
    args: [--number, --wrap, '120']
    additional_dependencies:
    - mdformat-gfm
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-comma]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/mxr/mirrors-pyright
  rev: 89ead1aa9974c0da927f2c2cc6a435f2ce8767fd  # frozen: v1.1.413
  hooks:
  - id: pyright
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/mxr/mirrors-ty
  rev: fdf5987c0856f51fc20614b56761196b31483ae1  # frozen: v0.0.78
  hooks:
  - id: ty
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/mxr/sync-typing-deps
  rev: 896a112838d434d8e607d4d636323c5914ab933f  # frozen: v0.7.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    language_version: python3.14
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
  - id: trailing-whitespace
