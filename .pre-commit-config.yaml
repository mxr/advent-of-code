repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: aab412d509121cb5f7533134b7e67f9fab59c682  # frozen: v0.16.4
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
  hooks:
  - id: pretty-format-toml
    args: [--autofix, --trailing-comma]
  - id: pretty-format-yaml
    args: [--autofix]
- repo: https://github.com/RobertCraigie/pyright-python
  rev: 392b6ba8e54be6d603e02e9f8d601d27b7a48d12  # frozen: v1.1.411
  hooks:
  - id: pyright
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/mxr/mirrors-ty
  rev: 37bffad357f01d2dbb25251a16441e660df41c50  # frozen: v0.0.74
  hooks:
  - id: ty
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/mxr/sync-typing-deps
  rev: 827c0d0f5b5dda0644170665034006604f9eb10b  # frozen: v0.6.0
  hooks:
  - id: sync-typing-deps
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
  hooks:
  - id: mypy
    language_version: python3.14
    additional_dependencies:
    - dijkstar
    - types-setuptools
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-docstring-first
  - id: debug-statements
  - id: end-of-file-fixer
  - id: pretty-format-json
    args: [--autofix]
  - id: trailing-whitespace
